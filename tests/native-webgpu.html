<!doctype html><meta charset="utf-8"><title>Spektra native backend validation</title><style>body{background:#222;color:#eee;font:15px monospace;padding:30px}button{padding:10px}pre{white-space:pre-wrap}</style><h1>C++ WASM ↔ WebGPU</h1><p>Pointwise adapter comparison. This does not validate the full Metal pipeline.</p><button id="run">Run parity checks</button><pre id="result">Ready</pre><script type="module">
import {loadNativeCore} from '../native-core.js';import {NativeWebGPU} from '../native-webgpu.js';
const result=document.querySelector('#result');document.querySelector('#run').onclick=async()=>{try{
 result.textContent='Loading native core and WebGPU…';const core=await loadNativeCore(),gpu=await NativeWebGPU.create();if(!gpu){result.textContent=JSON.stringify({supported:false,fallback:'C++ WASM'},null,2);return;}
 const cases=[['kodak_portra_400','kodak_portra_endura',{}],['kodak_portra_400','kodak_portra_endura',{filmExposure:1,printExposure:-.5,yFilter:8,mFilter:-5,couplers:1}],['kodak_gold_200','kodak_supra_endura',{}],['kodak_vision3_500t','kodak_2383',{}],['fujifilm_velvia_100','none',{}],['kodak_portra_400','di',{}],['ilford_hp5_plus_400','ilford_multigrade_iv_rc',{cameraFilter:'yellow',paperGrade:'4'}],['cinestill_800t','kodak_portra_endura',{}],['kodak_portra_400','kodak_portra_endura',{edr:true}]];
 const catalog=await(await fetch('../stock-catalog.json')).json();
 for(const stock of catalog.stocks.filter(s=>s.stage==='filming'))cases.push([stock.id,stock.type==='positive'?'none':stock.targetPrint||(stock.monochrome?'ilford_multigrade_iv_rc':'kodak_portra_endura'),{}]);
 for(const stock of catalog.stocks.filter(s=>s.stage==='printing'))cases.push([stock.monochrome?'ilford_hp5_plus_400':'kodak_portra_400',stock.id,{}]);
 const input=new Float32Array(522*3);input.set([0,0,0,.001,.001,.001,.184,.184,.184,1,1,1,16,16,16,1,0,0,0,1,0,0,0,1,.42,.19,.065,4,.02,.1]);let seed=12345;for(let i=30;i<input.length;i++){seed=(Math.imul(seed,1664525)+1013904223)>>>0;input[i]=(2**(seed/4294967296*8)-1)/16;}
 const report={supported:true,passed:true,scope:'WASM pointwise adapter vs WGSL, excludes native spatial/stochastic effects',cases:[]};
 for(const [film,paper,options]of cases){result.textContent='Comparing '+film+' / '+paper;await core.prepare(film,paper,options);const expected=core.pixels(input),actual=await gpu.run(core.gpuData(),{input});let max=0,sum=0;for(let i=0;i<expected.length;i++){const err=Math.abs(expected[i]-actual[Math.floor(i/3)*4+i%3]);max=Math.max(max,err);sum+=err;}const pass=max<3e-5;report.passed&&=pass;report.cases.push({film,paper,options,maximum:max,mean:sum/expected.length,pass});}
 await core.prepare('kodak_portra_400','kodak_portra_endura',{});const lut=await gpu.run(core.gpuData(),{size:33});report.lut={length:lut.length,finite:lut.every(Number.isFinite)};report.passed&&=report.lut.finite;result.textContent=JSON.stringify(report,null,2);
 }catch(e){result.textContent='ERROR: '+e.stack;}};
</script>
