<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>WebGPU 管线对照</title><style>body{background:#222;color:#ddd;font:14px monospace;padding:24px}pre{white-space:pre-wrap}button{padding:10px}</style><h1>WebGPU 管线对照</h1><button id="run">运行对照</button><pre id="report">检查 GPU…</pre><script type="module">
const report=document.querySelector('#report');try{const adapter=await navigator.gpu?.requestAdapter({powerPreference:'high-performance'});report.textContent=JSON.stringify({webgpu:Boolean(navigator.gpu),adapter:Boolean(adapter),info:adapter?.info,limits:adapter?{buffers:adapter.limits.maxStorageBuffersPerShaderStage,binding:adapter.limits.maxStorageBufferBindingSize}:null},null,2);}catch(e){report.textContent=e.stack;}
</script><script type="module" src="./webgpu-browser.mjs"></script></html>
<button id="large">大图对照</button><pre id="largeReport"></pre><script type="module" src="./webgpu-large.mjs"></script><button id="grain">颗粒分布与设备丢失</button><pre id="grainReport"></pre><script type="module" src="./webgpu-grain.mjs"></script>
